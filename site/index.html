<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakartvelo Exchange</title>
    <meta name="description" content="A fictional privatization auction simulation — equal citizen allocations, competitive bidding, runoff-elected governors, and real Solidity contracts. Not a real financial product." />
    <link rel="canonical" href="https://www.sakartvelo-exchange.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sakartvelo Exchange" />
    <meta property="og:description" content="A fictional privatization auction simulation — equal citizen allocations, competitive bidding, runoff-elected governors, and real Solidity contracts." />
    <meta property="og:url" content="https://www.sakartvelo-exchange.com/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Sakartvelo Exchange" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakartvelo Exchange" />
    <meta name="twitter:description" content="A fictional privatization auction simulation — equal citizen allocations, competitive bidding, runoff-elected governors, and real Solidity contracts." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data. Deliberately NOT typed as a FinancialProduct or
         InvestmentOrDeposit schema — that would contradict the site's own
         honest disclaimer that this is a fictional simulation, not a real
         financial product. WebApplication + a Game category is the
         accurate description of what this actually is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sakartvelo Exchange",
        "description": "A fictional privatization auction simulation — equal citizen allocations, competitive bidding, runoff-elected governors, and real Solidity contracts. Not a real financial product.",
        "url": "https://www.sakartvelo-exchange.com/",
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "inLanguage": ["en", "ka"]
      }
    </script>
    <!-- Google Analytics (gtag.js). Split into two script tags on purpose:
         the library loads from googletagmanager.com (allowlisted in
         vercel.json's CSP), and the actual init/config call lives in a
         same-origin file (gtag-init.js) instead of inline here — CSP
         blocks inline scripts by default, and adding 'unsafe-inline' back
         to script-src would undo real hardening done earlier. This gets
         the same tracking without that tradeoff. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2CHEJDL9S9"></script>
    <script src="/gtag-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
